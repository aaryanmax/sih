[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronovision-ai"
version = "1.0.0"
description = "Deep Multimodal Semantic Video Intelligence & Late-Interaction Retrieval Platform"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "SIH ChronoVision Team" }]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E402",  # module level import not at top of file
    "E501",  # line too long (handled by black)
    "F401",  # unused imports in stubs / init
    "F841",  # local variable unused in stubs
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.black]
line-length = 120
target-version = ['py314']

[tool.pyright]
include = ["packages", "apps", "scripts", "tests"]
extraPaths = [
    ".",
    "packages",
    "packages/multi_search",
    "packages/retrieval",
    "packages/embeddings",
    "packages/audio_ocr",
    "packages/vlm_engine",
    "packages/vllm_inference",
    "packages/pipeline",
    "packages/late_interaction",
    "packages/pipeline_engine",
    "apps/api"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "packages", "apps/api"]
