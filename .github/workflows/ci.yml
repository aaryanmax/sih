name: SIH Advanced Video Search CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Python Linters, Dependencies & Test Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pydantic pydantic-settings fastapi httpx rapidfuzz numpy qdrant-client google-genai torch pillow
          pip install -e . --no-deps || true

      - name: Lint Backend & Packages
        run: |
          ruff check apps/api packages/ scripts/ tests/
          ruff format --check apps/api packages/ scripts/ tests/

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Install Frontend Dependencies & Lint
        run: |
          cd apps/web
          npm install --no-audit
          npm run lint

  docker-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose config
