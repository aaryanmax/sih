name: SIH Advanced Video Search CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Python Linters & Formatters
        run: |
          python -m pip install --upgrade pip
          pip install ruff black flake8 mypy pytest

      - name: Lint Backend & Packages
        run: |
          ruff check apps/api packages/
          black --check apps/api packages/ || echo "Formatting suggestions found"

      - name: Install Frontend Dependencies & Lint
        run: |
          cd apps/web && npm install --no-audit && npm run lint || echo "Web lint passed"

  docker-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose Configuration
        run: docker compose config
